/* Layout: admin tool. Login card, then a list of room cards with actions, then one room's answers with delete buttons. */
:root{
  --blue:#243C92;--ink:#1C285C;--muted:#5F6A9A;--paper:#F1F3F9;--card:#FFFFFF;--line:rgba(36,60,146,.24);--soft:#E2E7F5;--shadow:rgba(18,28,80,.16);--on-blue:#FFFFFF;--danger:#C8395F;
  --font:'Gaegu','GaeguLocal','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  --wob:255px 18px 225px 18px/18px 225px 18px 255px;
  --gut-l:max(16px,env(safe-area-inset-left,0px));--gut-r:max(16px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.38;word-break:keep-all;overflow-wrap:anywhere;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
p,h1,h2{margin:0}
.wrap{max-width:620px;margin:0 auto;padding:14px var(--gut-r) 40px var(--gut-l);display:flex;flex-direction:column;gap:16px}
.top{display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:10px}
.top h1{font-size:26px;color:var(--blue);text-align:center;line-height:1.1}
.ibtn{width:46px;height:46px;display:grid;place-items:center;color:var(--blue);background:var(--card);border:2px solid var(--blue);border-radius:var(--wob);text-decoration:none}
.ibtn svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.pill{font-size:17px;padding:6px 14px;border:2px solid var(--blue);border-radius:var(--wob);color:var(--blue);background:var(--card);white-space:nowrap}
.pill.solid{background:var(--blue);color:var(--on-blue)}
.pill.danger{border-color:var(--danger);color:var(--danger)}
.pill.danger.solid{background:var(--danger);color:var(--on-blue)}
.link{font-size:16px;color:var(--blue);text-decoration:underline;text-underline-offset:3px}
.link.danger{color:var(--danger)}
.field{width:100%;font:inherit;font-size:20px;padding:10px 13px;border:2px solid var(--blue);border-radius:var(--wob);background:var(--card);color:var(--ink)}
#roomList,#postList{display:flex;flex-direction:column;gap:12px}
.none{color:var(--muted);text-align:center;padding:16px 0}
.none.sm{font-size:15px;padding:4px 0;text-align:left}
code{font-family:ui-monospace,Menlo,monospace;font-size:.9em;background:var(--soft);padding:1px 6px;border-radius:6px;-webkit-user-select:all;user-select:all}

/* login */
#vLogin{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px var(--gut-r) 24px var(--gut-l)}
.login{width:min(340px,100%);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.login img{width:96px}
.login h1{font-size:34px;color:var(--blue)}
.login form{width:100%;display:flex;flex-direction:column;gap:12px}
.bigbtn{width:100%;padding:12px;font-size:23px;font-weight:700;background:var(--blue);color:var(--on-blue);border-radius:var(--wob)}
.err{min-height:1.4em;font-size:16px;color:var(--danger);display:flex;flex-direction:column;gap:6px}
.err code{color:var(--ink);font-size:13px;word-break:break-all}

/* rooms */
.note{padding:12px 14px;font-size:16px;background:var(--card);border:2px dashed var(--blue);border-radius:16px;color:var(--ink)}
.room{display:flex;flex-direction:column;gap:8px;padding:14px 16px;background:var(--card);border:2px solid var(--line);border-radius:18px 22px 20px 24px/22px 18px 24px 20px;box-shadow:0 2px 8px var(--shadow)}
.r-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.r-top b{font-size:23px;color:var(--blue)}
.r-cnt{font-size:15px;color:var(--muted);white-space:nowrap}
.r-code{font-size:16px;color:var(--muted)}
.r-acts,.row{display:flex;flex-wrap:wrap;gap:8px}
.r-form{display:flex;flex-direction:column;gap:8px;padding-top:4px}
.hint{font-size:15px;color:var(--muted)}
.warn{font-size:16px;color:var(--danger)}
.add{display:flex;flex-direction:column;gap:10px;padding:14px 16px;background:var(--card);border:2px solid var(--blue);border-radius:18px 22px 20px 24px/22px 18px 24px 20px}
.add h2{font-size:21px;color:var(--blue)}

/* one room */
.sub{font-size:16px;color:var(--muted);text-align:center;margin-top:-10px}
.post{display:flex;flex-direction:column;gap:6px;padding:12px 14px;background:var(--card);border:2px solid var(--line);border-radius:16px 20px 18px 22px/20px 16px 22px 18px}
.p-meta{display:flex;justify-content:space-between;gap:8px;font-size:15px;color:var(--muted)}
.p-meta b{font-size:18px;color:var(--ink)}
.p-q{font-size:14.5px;color:var(--blue)}
.p-txt{font-size:18px;white-space:pre-wrap}
.p-acts{display:flex;align-items:center;gap:12px;font-size:15px;color:var(--muted)}
.p-acts .pill{margin-left:auto}
.p-confirm{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:16px;color:var(--danger)}
.p-cms{display:flex;flex-direction:column;gap:6px;padding:8px 0 0 12px;border-left:3px solid var(--soft)}
.cm{display:flex;align-items:baseline;gap:8px;font-size:16px}
.cm b{flex:0 0 auto}
.cm span{flex:1 1 auto;min-width:0;white-space:pre-wrap}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);z-index:70;padding:8px 18px;font-size:17px;background:var(--ink);color:var(--on-blue);border-radius:18px;white-space:nowrap;pointer-events:none}
</style>
</head>
<body>
