/* Layout: one-screen card table. Home = four deck covers + mixed deck. Deck = header, drawn card, tool row, fan of face-down cards at the bottom. */
:root{
  --blue:#243C92;
  --blue-deep:#1A2D72;
  --ink:#1C285C;
  --muted:#5F6A9A;
  --paper:#F1F3F9;
  --card:#FFFFFF;
  --line:rgba(36,60,146,.24);
  --soft:#E2E7F5;
  --shadow:rgba(18,28,80,.22);
  --on-blue:#FFFFFF;
  --font:'Gaegu','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  --wob:255px 18px 225px 18px/18px 225px 18px 255px;
  --wob2:18px 225px 18px 255px/255px 18px 225px 18px;
  --gut-l:max(16px,env(safe-area-inset-left,0px));
  --gut-r:max(16px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
*{box-sizing:border-box}
html{height:100%;background:var(--paper)}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
button:disabled{opacity:.32;cursor:default}
p,h1,h2,h3{margin:0}
svg.ic{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;display:block}

#app{position:relative;height:100%;max-width:540px;margin:0 auto;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding-left:var(--gut-l);padding-right:var(--gut-r);transition:opacity .28s ease,transform .28s ease,visibility 0s linear 0s}
.screen.off{opacity:0;visibility:hidden;pointer-events:none;transform:scale(.97);transition:opacity .22s ease,transform .22s ease,visibility 0s linear .22s}

/* ----- small round-ish buttons ----- */
.ibtn{flex:0 0 auto;width:46px;height:46px;display:grid;place-items:center;color:var(--blue);background:var(--card);border:2px solid var(--blue);border-radius:var(--wob);box-shadow:2px 3px 0 var(--soft)}
.ibtn:active{transform:translate(1px,2px);box-shadow:0 0 0 var(--soft)}

/* ===== HOME ===== */
#home{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-block:10px 22px;gap:14px}
.home-top{display:grid;grid-template-columns:46px 1fr 46px;align-items:start;gap:8px}
.brand{display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:4px}
.brand img{width:104px;height:auto;display:block}
.brand p{margin-top:8px;font-size:clamp(15px,4.8vw,19px);letter-spacing:.06em;color:var(--blue);white-space:nowrap}
.lead{text-align:center;font-size:17px;color:var(--muted);text-wrap:balance}
.decks{display:grid;grid-template-columns:repeat(2,minmax(0,min(40vw,150px)));justify-content:center;gap:24px 30px;padding-block:6px}
.dtile{display:block;text-align:center}
.dcover{position:relative;width:100%;aspect-ratio:504/704;container-type:inline-size;isolation:isolate}
.dcover .stk{position:absolute;inset:0;border-radius:4.76cqw;background:var(--blue-deep);z-index:-1;box-shadow:0 2px 6px var(--shadow)}
.dcover .stk.s1{transform:rotate(3.2deg) translate(2.2cqw,1cqw)}
.dcover .stk.s2{transform:rotate(-2.4deg) translate(-1.6cqw,1.6cqw);background:var(--blue)}
.dtile:active .dcover{transform:scale(.97)}
.decks{position:relative}
.dtile{position:relative;z-index:0}
.dtile.open{z-index:4}
.dcover .stk{transition:transform .45s cubic-bezier(.3,1.7,.5,1)}
.dtile.open .stk.s1{transform:rotate(8deg) translate(6cqw,2.5cqw)}
.dtile.open .stk.s2{transform:rotate(-7deg) translate(-5cqw,3cqw)}
.dcover .cv{transition:transform .38s cubic-bezier(.3,1.6,.5,1)}
.dtile.open .cv{transform:translateY(-2.5cqw) rotate(-1.5deg)}
.tapme{position:absolute;right:-12px;top:-12px;z-index:5;width:46px;height:46px;border-radius:50%;background:var(--blue);color:var(--on-blue);display:grid;place-items:center;box-shadow:0 3px 8px var(--shadow);opacity:0;transform:scale(.3);transition:opacity .2s,transform .3s cubic-bezier(.3,1.7,.5,1);pointer-events:none}
.tapme svg.ic{width:28px;height:28px}
.dtile.open .tapme{opacity:1;transform:scale(1);animation:tapme 1.3s ease-in-out .4s infinite}
@keyframes tapme{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.dpop{position:fixed;left:0;top:0;z-index:20;width:228px;padding:11px 13px 13px;background:var(--card);border:2px solid var(--blue);border-radius:20px 26px 22px 28px/24px 20px 28px 22px;box-shadow:0 10px 28px var(--shadow);color:var(--blue);cursor:pointer;-webkit-tap-highlight-color:transparent}
.dpop:active{transform:scale(.98)}
.dpop::before{content:"";position:absolute;left:calc(var(--tail,50%) - 8px);top:-9px;width:14px;height:14px;background:var(--card);border-left:2px solid var(--blue);border-top:2px solid var(--blue);transform:rotate(45deg)}
.dpop.above::before{top:auto;bottom:-9px;transform:rotate(225deg)}
.dp-head{display:flex;align-items:center;gap:6px;margin-bottom:9px}
.dp-head .dp-cat{width:26px;height:26px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.dp-head b{flex:1 1 auto;min-width:0;font-size:19px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dp-go{flex:0 0 auto;display:flex;align-items:center;padding:3px 7px 3px 5px;color:var(--on-blue);background:var(--blue);border-radius:var(--wob)}
.dp-go svg.ic{width:18px;height:18px}
.dp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px 6px}
.dp-grid svg{width:31px;height:31px;margin:0 auto;display:block;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.dp-grid svg.used{opacity:.22}
.dtile.empty .cv{filter:saturate(.4) brightness(1.05);opacity:.75}

.cv{position:absolute;inset:0;border-radius:4.76cqw;overflow:hidden;background:var(--card);box-shadow:0 3px 10px var(--shadow);color:var(--on-blue)}
.cv-top{position:absolute;left:0;top:0;width:100%;height:79.37cqw;background:var(--blue)}
.cv-wave{position:absolute;left:0;top:78.97cqw;width:100%;height:8.73cqw;display:block;fill:var(--blue)}
.cv-deco{position:absolute;fill:none;stroke:var(--on-blue);stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.cv-deco.a{left:8.73cqw;top:9.13cqw;width:17.06cqw;stroke-width:1.6}
.cv-deco.b{left:78.57cqw;top:63.1cqw;width:13.1cqw;stroke-width:1.8}
.cv-deco.c{left:80.16cqw;top:13.89cqw;width:5.95cqw;stroke-width:2.4}
.cv-title{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:2.78cqw;color:var(--on-blue)}
.cv-title svg{width:25.4cqw;height:25.4cqw;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.cv-name{font-size:9.13cqw;font-weight:700;line-height:1.1;white-space:nowrap}
.cv-sub{font-size:7cqw;letter-spacing:.02em;opacity:.85;margin-top:-1.19cqw;white-space:nowrap}
.cv-foot{position:absolute;left:0;right:0;top:89.68cqw;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.57cqw;padding-bottom:3.17cqw;color:var(--blue)}
.cv-foot img{width:39.68cqw;height:auto;display:block}
.cv-foot p{font-size:4.76cqw;letter-spacing:.06em}

.mixed{display:flex;align-items:center;gap:16px;width:100%;padding:14px 18px 14px 14px;background:var(--card);border:2px solid var(--blue);border-radius:var(--wob2);box-shadow:3px 4px 0 var(--soft);text-align:left}
.mixed:active{transform:translate(1px,2px);box-shadow:0 0 0 var(--soft)}
.mx-fan{position:relative;flex:0 0 76px;height:64px}
.mx-fan .back{position:absolute;left:24px;top:2px;width:40px;box-shadow:0 1px 4px var(--shadow)}
.mx-fan .back:nth-child(1){transform:rotate(-16deg) translateX(-14px)}
.mx-fan .back:nth-child(2){transform:rotate(-3deg) translateX(-2px)}
.mx-fan .back:nth-child(3){transform:rotate(11deg) translateX(10px)}
.mx-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.mx-txt b{font-size:clamp(19px,6vw,24px);color:var(--blue);line-height:1.1;white-space:nowrap}
.mx-txt span{font-size:17px;color:var(--muted)}
.home-foot{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:4px}
.linkbtn{font-size:17px;color:var(--muted);text-decoration:underline;text-underline-offset:4px;padding:6px 10px}
.confirm{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 16px;border:2px dashed var(--line);border-radius:var(--wob);text-align:center;font-size:17px}
.confirm div{display:flex;gap:10px}
.pill{font-size:18px;padding:8px 18px;border:2px solid var(--blue);border-radius:var(--wob);color:var(--blue);background:var(--card)}
.pill.solid{background:var(--blue);color:var(--on-blue)}

/* ===== DECK ===== */
.bar{display:grid;grid-template-columns:46px 1fr 46px;align-items:center;gap:8px;padding-block:8px 4px}
.bar-mid{display:flex;flex-direction:column;align-items:center;min-width:0}
.bar-title{display:flex;align-items:center;gap:6px;font-size:24px;font-weight:700;color:var(--blue);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bar-title svg{width:24px;height:24px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.bump{animation:bump .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.35);color:var(--blue)}100%{transform:scale(1)}}

.play{position:relative;flex:1 1 auto;min-height:0}
.ph{position:absolute;left:50%;top:50%;width:var(--pw);aspect-ratio:504/704;transform:translate(-50%,-50%);display:grid;place-items:center}
.ph::before{content:"";position:absolute;inset:0;border:2.5px dashed var(--line);border-radius:22px 30px 26px 34px/30px 24px 34px 26px}
.ph svg{width:72px;height:72px;fill:none;stroke:var(--line);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.pcard{position:absolute;left:50%;top:50%;width:var(--pw);aspect-ratio:504/704;margin-left:calc(var(--pw) / -2);margin-top:calc(var(--pw) * -0.6984);perspective:1600px;touch-action:none;container-type:inline-size;z-index:2}
.pcard .flip{position:absolute;inset:0;transform-style:preserve-3d}
.face{position:absolute;inset:0;border-radius:4.76cqw;overflow:hidden;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.face.backf{transform:rotateY(180deg)}
.front{background:var(--card);box-shadow:0 10px 28px var(--shadow),0 2px 4px var(--shadow);display:flex;flex-direction:column;align-items:center;padding:8cqw 8cqw 6cqw;color:var(--ink)}
.f-frame{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:var(--line);stroke-width:1.5px;vector-effect:non-scaling-stroke;pointer-events:none}
.f-top{position:relative;width:100%;display:flex;justify-content:space-between;align-items:flex-start;gap:3cqw}
.f-tag{display:flex;flex-direction:column;gap:.5cqw;min-width:0}
.f-cat{font-size:6.6cqw;font-weight:700;color:var(--blue);line-height:1.1}
.f-no{font-size:5.4cqw;color:var(--muted);letter-spacing:.06em}
.f-lv{display:flex;flex-direction:column;align-items:flex-end;gap:.6cqw;flex:0 0 auto}
.f-lv span{font-size:5.4cqw;color:var(--muted)}
.stars{display:flex;color:var(--blue);gap:.4cqw}
.star{width:8.2cqw;height:8.2cqw;fill:currentColor;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round;display:block}
.f-mid{position:relative;flex:1 1 auto;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5.5cqw}
.f-icon{color:var(--blue)}
.f-icon svg{width:30cqw;height:30cqw;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.f-q{position:relative;font-size:8.2cqw;font-weight:700;line-height:1.34;text-align:center;word-break:keep-all;overflow-wrap:break-word;text-wrap:balance;color:var(--ink);padding-inline:1cqw}
.f-q.s2{font-size:7.3cqw}
.f-q.s3{font-size:6.5cqw}
.f-skip{margin-top:-1.5cqw;font-size:5cqw;color:var(--muted);padding:.8cqw 3.4cqw;border:1.5px dashed var(--line);border-radius:var(--wob)}
.f-foot{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2.4cqw;padding-top:5cqw}
.squig{width:22cqw;height:2.2cqw;fill:none;stroke:var(--blue);stroke-width:1.6;stroke-linecap:round;opacity:.55;display:block}
.f-foot img{width:22cqw;height:auto;display:block;opacity:.9}

.bbox{position:absolute;left:16.67cqw;top:47.62cqw;width:66.67cqw;height:44.44cqw;background:var(--card);color:var(--blue);border-radius:4.37cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.38cqw}
.bbox img{width:45.63cqw;height:auto;display:block}
.bbox span{font-size:4.37cqw;letter-spacing:.06em;white-space:nowrap}
@container (max-width:150px){.bbox span{display:none}}

/* tool row */
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding-block:8px 6px}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px 2px 5px;color:var(--blue);background:var(--card);border:2px solid var(--blue);border-radius:var(--wob);box-shadow:2px 3px 0 var(--soft);font-size:clamp(13px,3.9vw,15px);line-height:1.05;text-align:center;white-space:nowrap}
@media (max-width:370px){.tool{white-space:normal}}
.tool:nth-child(even){border-radius:var(--wob2)}
.tool:active:not(:disabled){transform:translate(1px,2px);box-shadow:0 0 0 var(--soft)}
.tool svg.ic{width:28px;height:28px}

/* fan */
.fan{position:relative;z-index:1;flex:0 0 auto;height:140px;margin-left:calc(-1 * var(--gut-l));margin-right:calc(-1 * var(--gut-r));touch-action:none;overflow:hidden}
.fan-hint{position:absolute;left:calc(var(--fx,0px) * 2);right:0;top:2px;text-align:center;font-size:16px;color:var(--muted);pointer-events:none;transition:color .2s}
.fan-hint.go{color:var(--blue);font-weight:700}
.fan-cards{position:absolute;inset:0}
.fcard{position:absolute;left:calc(50% + var(--fx,0px));top:var(--top,46px);width:var(--cw,110px);margin-left:calc(var(--cw,110px) / -2);transform-origin:50% calc(100% + var(--R,260px));transform:rotate(var(--a,0deg)) translateY(calc(var(--lift,0px) + var(--y,0px))) scale(var(--sc,1));transition:transform .45s cubic-bezier(.2,.85,.25,1),box-shadow .25s;box-shadow:-3px 1px 7px var(--shadow),inset 0 0 0 1.5px rgba(255,255,255,.6);will-change:transform;pointer-events:none}
.fcard.cand{box-shadow:0 -4px 14px var(--shadow),inset 0 0 0 2px rgba(255,255,255,.95)}
.fan-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:0 10px 0 86px;text-align:center}
.fan-empty .pill{font-size:17px;padding:7px 14px}
.fan-empty p{font-size:21px;font-weight:700;color:var(--blue)}
.fan-empty div{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* discard pile, bottom-left */
.pile{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:10px;z-index:3;width:62px;height:84px;display:block;pointer-events:none}
.pile-cards{position:absolute;left:4px;bottom:0;width:54px;aspect-ratio:504/704}
.mini{position:absolute;inset:0;background:var(--card);border-radius:4.76%/3.41%;box-shadow:0 2px 6px var(--shadow);display:grid;place-items:center;color:var(--blue)}
.mini svg{width:58%;height:58%;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.mini.empty{background:var(--paper);box-shadow:none;border:2px dashed var(--line)}
.pile-n{position:absolute;right:-8px;top:-8px;min-width:30px;height:30px;padding:0 7px;display:grid;place-items:center;border-radius:15px;background:var(--blue);color:var(--on-blue);font-size:17px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;box-shadow:0 2px 0 var(--blue-deep)}
.pmenu{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:106px;z-index:30;width:min(270px,calc(100% - 24px));padding:14px 16px;background:var(--card);border:2px solid var(--blue);border-radius:20px 26px 22px 28px/24px 20px 28px 22px;box-shadow:0 8px 22px var(--shadow);display:flex;flex-direction:column;gap:12px;font-size:19px;line-height:1.3}
.pmenu::after{content:"";position:absolute;left:30px;bottom:-10px;width:16px;height:16px;background:var(--card);border-right:2px solid var(--blue);border-bottom:2px solid var(--blue);transform:rotate(45deg)}
.pmenu div{display:flex;gap:10px;justify-content:flex-end}
.pmenu .pill{font-size:18px;padding:7px 16px}
.pile.open .pile-cards{transform:translateY(-3px)}
.pile.none .pile-n{background:var(--card);color:var(--muted);box-shadow:inset 0 0 0 2px var(--line)}

/* ===== GRID SHEET ===== */
.sheet-wrap{position:fixed;inset:0;z-index:40}
.sheet-dim{position:absolute;inset:0;background:rgba(16,24,64,.42);opacity:0;transition:opacity .25s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:540px;margin:0 auto;height:min(88%,760px);background:var(--paper);border-radius:26px 30px 0 0/22px 26px 0 0;display:flex;flex-direction:column;transform:translateY(102%);transition:transform .32s cubic-bezier(.2,.85,.25,1);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -6px 24px var(--shadow)}
.sheet-wrap.open .sheet-dim{opacity:1}
.sheet-wrap.open .sheet{transform:none}
.sheet-head{display:grid;grid-template-columns:1fr 46px;align-items:center;gap:10px;padding:14px var(--gut-r) 8px var(--gut-l)}
.sheet-head b{font-size:26px;color:var(--blue);line-height:1.1}
.sheet-head span{display:block;font-size:16px;color:var(--muted)}
.sheet-body{position:relative;flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px var(--gut-r) 24px var(--gut-l);display:flex;flex-direction:column;gap:18px}
.gsec h3{font-size:21px;color:var(--blue);margin:2px 2px 8px}
.ggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.gtile{position:relative;aspect-ratio:1/.88;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--card);border:2px solid var(--blue);border-radius:var(--wob);color:var(--blue);box-shadow:2px 3px 0 var(--soft);transition:opacity .2s,transform .15s}
.gtile:nth-child(3n+2){border-radius:var(--wob2)}
.gtile svg{width:46%;height:46%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gtile span{font-size:15px;letter-spacing:.06em;color:var(--muted)}
.gtile.used{opacity:.36}
.gtile.sel{opacity:1;background:var(--blue);color:var(--on-blue);transform:scale(1.06);z-index:2}
.gtile.sel span{color:var(--on-blue)}
.gbub{position:absolute;z-index:5;width:min(300px,calc(100% - 24px));padding:14px 16px 12px;background:var(--card);border:2px solid var(--blue);border-radius:20px 26px 22px 28px/24px 20px 28px 22px;box-shadow:0 8px 22px var(--shadow);text-align:left;color:var(--ink)}
.gbub::after{content:"";position:absolute;left:calc(var(--tail,50%) - 9px);bottom:-10px;width:16px;height:16px;background:var(--card);border-right:2px solid var(--blue);border-bottom:2px solid var(--blue);transform:rotate(45deg)}
.gbub.below::after{bottom:auto;top:-10px;transform:rotate(225deg)}
.gb-top{display:flex;align-items:center;gap:10px;margin-bottom:6px;padding-right:34px}
.gb-x{position:absolute;right:6px;top:6px;width:36px;height:36px;display:grid;place-items:center;color:var(--muted)}
.gb-x svg.ic{width:20px;height:20px}
.gb-top .stars{gap:1px}
.gb-top .star{width:19px;height:19px}
.gb-top span{font-size:15px;color:var(--muted)}
.gbub p{font-size:20px;font-weight:700;line-height:1.32;word-break:keep-all;text-wrap:pretty}
.gb-hint{margin-top:8px;font-size:15px;color:var(--blue)}

/* ===== ORDER ===== */
.order{position:fixed;inset:0;z-index:60;background:var(--blue);color:var(--on-blue);touch-action:none;overflow:hidden}
.order .ibtn{color:var(--blue);border-color:var(--on-blue);box-shadow:none}
.o-setup{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 12px) var(--gut-r) calc(env(safe-area-inset-bottom,0px) + 24px) var(--gut-l);gap:18px;text-align:center}
.o-setup .row{align-self:stretch;display:flex;justify-content:flex-end}
.o-setup h2{font-size:38px;line-height:1.1;margin-top:4vh}
.o-setup .lead2{font-size:20px;opacity:.85;text-wrap:balance}
.stepper{display:flex;align-items:center;gap:22px;margin-top:10px}
.stepper button{width:64px;height:64px;display:grid;place-items:center;border:2.5px solid var(--on-blue);border-radius:var(--wob);color:var(--on-blue)}
.stepper button svg.ic{width:30px;height:30px}
.stepper output{font-size:88px;font-weight:700;line-height:1;min-width:1.4em;font-variant-numeric:tabular-nums}
.o-note{font-size:17px;opacity:.85;max-width:300px;text-wrap:balance}
.bigbtn{margin-top:auto;width:100%;max-width:340px;padding:16px;font-size:26px;font-weight:700;background:var(--card);color:var(--blue);border-radius:var(--wob);box-shadow:3px 4px 0 var(--blue-deep)}
.bigbtn:active{transform:translate(1px,2px);box-shadow:0 0 0 var(--blue-deep)}
.o-touch{position:absolute;inset:0}
.o-head{position:absolute;left:0;right:0;top:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:calc(env(safe-area-inset-top,0px) + 14px) 72px 0;text-align:center;pointer-events:none}
.o-msg{font-size:26px;font-weight:700;line-height:1.2;text-wrap:balance}
.o-cnt{font-size:18px;opacity:.8;font-variant-numeric:tabular-nums}
.o-close{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:var(--gut-r);z-index:3}
.o-actions{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;justify-content:center;gap:12px;z-index:3}
.o-actions .pill{font-size:22px;padding:10px 24px;border-color:var(--on-blue)}
.o-actions .pill.ghost{background:transparent;color:var(--on-blue)}
.finger{position:absolute;left:0;top:0;width:112px;height:112px;margin:-56px 0 0 -56px;pointer-events:none;transition:transform .08s linear}
.finger .fin{position:absolute;inset:0}
.finger svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.finger .blob{fill:var(--fc);opacity:.95}
.finger .ring{fill:none;stroke:var(--on-blue);stroke-width:3;opacity:.5}
.finger .prog{fill:none;stroke:var(--on-blue);stroke-width:6;stroke-linecap:round;transform:rotate(-90deg);transform-origin:56px 56px}
.finger .fnum{position:absolute;inset:0;display:grid;place-items:center;font-size:52px;font-weight:700;color:var(--blue);opacity:0;transform:scale(.4);transition:transform .35s cubic-bezier(.3,1.7,.5,1),opacity .2s}
.finger.ranked .fnum{opacity:1;transform:scale(1)}
.finger.first .fin{animation:pulse 1s ease-in-out infinite}
.finger.first .fnum{font-size:62px}
@keyframes pulse{50%{transform:scale(1.16)}}
.finger.dim{opacity:.55}
@keyframes popin{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.finger svg{animation:popin .22s cubic-bezier(.3,1.6,.5,1)}

@media (prefers-reduced-motion:reduce){
  .fcard,.screen,.sheet{transition-duration:.01s!important}
  .finger.first .fin{animation:none}
}
</style>
</head>

function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function hash(str){ let h = 2166136261; for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed){ let s = seed || 1; return () => (s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296; }

/* ---------- state (saved on this phone) ---------- */
function fresh(){ return {draw: shuffle(ALL), discard: [], hands: {'1': null, '2': null, '3': null, '4': null, all: null}, ppl: 4}; }
function valid(s){
  try {
    const seen = s.draw.concat(s.discard, VIEWS.map(v => s.hands[v]).filter(Boolean));
    return seen.length === ALL.length && new Set(seen).size === ALL.length && seen.every(id => BY[id]);
  } catch (e) { return false; }
}

  try { const r = localStorage.getItem(KEY); if (r){ const s = JSON.parse(r); if (valid(s)){ s.ppl = s.ppl || 4; return s; } } } catch (e) {}
  return fresh();
}

/* ---------- haptics ---------- */
const Haptic = (() => {
  const hasVib = typeof navigator.vibrate === 'function';
  let lab = null;
  function tick(){
    try {
      if (!lab){
        lab = document.createElement('label');
        lab.setAttribute('aria-hidden', 'true');
        lab.style.cssText = 'position:fixed;left:-200px;top:0;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden';
        const inp = document.createElement('input');
        inp.type = 'checkbox'; inp.setAttribute('switch', ''); inp.tabIndex = -1;
        lab.appendChild(inp); document.body.appendChild(lab);
        lab.addEventListener('click', e => e.stopPropagation());
      }
      lab.click();
    } catch (e) {}
  }
  function go(p){
    if (hasVib){ try { navigator.vibrate(p); } catch (e) {} return; }
    const n = Array.isArray(p) ? Math.ceil(p.length / 2) : 1;
    tick(); for (let k = 1; k < n; k++) setTimeout(tick, k * 90);
  }
  return {
    tap: () => go(10), tick: () => go(6), draw: () => go([24, 50, 36]), toss: () => go(16),
    riffle: () => go([6, 28, 6, 28, 6, 28, 6, 28, 6]), beat: () => go(20), win: () => go([70, 70, 140])
  };
})();

  const b = e.target.closest('button');
  if (b && !b.disabled && b.dataset.hap !== 'none' && !b.classList.contains('gtile')) Haptic.tap();
}, true);

function starSVG(r){
  const pts = [];
  for (let i = 0; i < 10; i++){
    const outer = i % 2 === 0;
    const rad = (outer ? 10.2 : 4.6) * (1 + (r() - .5) * .24);
    const a = (-90 + i * 36 + (r() - .5) * 10) * Math.PI / 180;
    pts.push((rad * Math.cos(a)).toFixed(2) + ' ' + (rad * Math.sin(a)).toFixed(2));
  }
  const rot = ((r() - .5) * 30).toFixed(1), dy = ((r() - .5) * 14).toFixed(1), sc = (.88 + r() * .2).toFixed(2);
  return `<svg class="star" viewBox="-12 -12 24 24" style="transform:translateY(${dy}%) rotate(${rot}deg) scale(${sc})"><path d="M${pts.join('L')}Z"/></svg>`;
}

/* ---------- DECK ---------- */
let cur = null, candidate = null, busy = false, pcEl = null;
const fanEls = new Map();
let geo = {cw: 110, ch: 154, R: 270, top: 58, half: 15, fx: 0};

function computeGeo(){
  const W = fan.clientWidth || window.innerWidth;
  const cw = Math.round(Math.max(92, Math.min(132, W * 0.29)));
  const ch = cw * 704 / 504;
  const R = Math.round(Math.max(220, W * 0.7));
  /* the hand sits a little to the right so the discard pile has its own corner */
  const pileRight = 12 + 62;
  const fx = W < 640 ? 30 : 0;
  const cx = W / 2 + fx;
  const avail = Math.min(cx - pileRight + 14, W - cx + cw * .18);
  const half = Math.asin(Math.min(.9, Math.max(.08, (avail - cw * .5) / (R + ch)))) * 180 / Math.PI;
  const top = 58;
  geo = {cw, ch, R, top, half, fx};
  fan.style.setProperty('--fx', fx + 'px');
  fan.style.setProperty('--cw', cw + 'px');
  fan.style.setProperty('--R', R + 'px');
  fan.style.setProperty('--top', top + 'px');
  fan.style.height = Math.round(top + ch * 0.6) + 'px';
}
function sizePlay(){

  deck.style.setProperty('--pw', pw + 'px');
}
const fanIds = () => S.draw.filter(id => inView(id, cur));

function layoutFan(mode){
  const ids = fanIds(), n = ids.length;

  const span = step * (n - 1);
  const keep = new Set(ids);
  for (const [id, el] of fanEls){ if (!keep.has(id)){ el.remove(); fanEls.delete(id); } }
  ids.forEach((id, i) => {
    let el = fanEls.get(id);

      if (mode !== 'enter'){ el.style.transition = 'none'; el.style.setProperty('--a', (-span / 2 + i * step).toFixed(2) + 'deg'); el.animate([{opacity: 0}, {opacity: 1}], {duration: 260}); el.offsetWidth; el.style.transition = ''; }

    btn.textContent = back ? `다시 섞기 (${back}장)` : '다시 섞기';
  }

}
function updateHint(){
  fanHint.textContent = candidate ? '튀어나온 카드를 한 번 더 눌러 뽑아보세요' : '손가락으로 쓸어서 카드를 골라보세요';

let pendingPile = 0;
const pmenu = $('#pmenu');
function inPile(x, y){ const r = pile.getBoundingClientRect(); return x >= r.left - 6 && x <= r.right + 4 && y >= r.top - 12 && y <= r.bottom + 6; }
function togglePmenu(on){ pmenu.hidden = !on; pile.classList.toggle('open', on); }
fan.addEventListener('click', e => { if (inPile(e.clientX, e.clientY) && !e.target.closest('button')){ e.stopPropagation(); Haptic.tap(); togglePmenu(pmenu.hidden); } });
document.addEventListener('click', e => { if (!pmenu.hidden && !e.target.closest('#pmenu') && !(e.target.closest('#fan') && inPile(e.clientX, e.clientY))) togglePmenu(false); });
$('#pmNo').addEventListener('click', () => togglePmenu(false));
$('#pmYes').addEventListener('click', () => { togglePmenu(false); resetView(); });
/* put every card of this deck back (except ones open in another deck) and shuffle */
function resetView(){
  const others = new Set(VIEWS.filter(v => v !== cur).map(v => S.hands[v]).filter(Boolean));
  const mine = ALL.filter(id => inView(id, cur) && !others.has(id));
  commit(() => {
    S.discard = S.discard.filter(id => !inView(id, cur));
    S.hands[cur] = null;
    S.draw = S.draw.filter(id => !inView(id, cur)).concat(shuffle(mine));
  });
  candidate = null; renderPlay(false); renderPile(); Haptic.riffle(); lock(700); enterFan(); updateCounts();
}

function setCandidate(id){
  if (candidate === id) return;
  const prev = candidate && fanEls.get(candidate); if (prev) prev.classList.remove('cand');
  candidate = id;
  const el = id && fanEls.get(id); if (el) el.classList.add('cand');
  updateHint(); if (id) Haptic.tick();
}
const LIFT = 36;
let delayT = 0;
/* stagger delays are only for the deal / shuffle animation; drop them so a touched card reacts at once */
function clearDelays(){ for (const el of fanEls.values()) el.style.transitionDelay = '0ms'; }
/* cards near the finger rise a little (a soft wave); the chosen one rises all the way */
function applyLift(ang){
  const ids = fanIds(), n = ids.length;
  const step = n > 1 ? Math.min(7, 2 * geo.half / (n - 1)) : 7;
  const ci = ids.indexOf(candidate);
  ids.forEach((id, i) => {
    const el = fanEls.get(id); if (!el) return;
    let lift = 0;
    if (ci >= 0){ const d = Math.abs(i - ci); lift = d === 0 ? -LIFT : (press && d === 1 ? -LIFT * .22 : 0); }
    const was = el._lift || 0;
    if (lift !== was){
      const up = lift < was;
      el.style.transitionDuration = up ? '.12s' : '.5s';
      el.style.transitionTimingFunction = up ? 'cubic-bezier(.2,.8,.3,1)' : 'cubic-bezier(.4,0,.2,1)';
    }

    el.style.setProperty('--lift', lift.toFixed(1) + 'px');

/* which card is really under the finger: test each card's own (rotated) box, top card first */
function hitCard(x, y){
  const ids = fanIds(); if (!ids.length) return null;

  const cx = r.left + r.width / 2 + geo.fx, py = r.top + geo.top + geo.ch + geo.R;
  const dx = x - cx, dy = y - py;
  for (let i = ids.length - 1; i >= 0; i--){
    const el = fanEls.get(ids[i]); if (!el) continue;
    const t = el._a * Math.PI / 180, c = Math.cos(t), sn = Math.sin(t);

function fanAngle(x, y){

const fanHit = (x, y) => hitCard(x, y) || nearest(fanAngle(x, y));

/* fan touch: slide to raise a card, tap the raised card again to draw */
let press = null, moveRAF = 0;
fan.addEventListener('pointerdown', e => {

  try { fan.setPointerCapture(e.pointerId); } catch (err) {}
  clearTimeout(delayT); clearDelays();

fan.addEventListener('pointermove', e => {

  });

function endPress(e, cancel){

fan.addEventListener('pointerup', e => endPress(e, false));
fan.addEventListener('pointercancel', e => endPress(e, true));

function lock(ms){ busy = true; setTimeout(() => { busy = false; }, ms); }

function drawCard(id, fromGrid){
  if (!id) return;

  if (prev === id) return;
  const fanEl = fanEls.get(id);
  const from = fanEl ? {rect: fanEl.getBoundingClientRect(), angle: fanEl._a} : null;
  commit(() => { removeEverywhere(id); if (prev) S.discard.push(prev); S.hands[cur] = id; });
  if (prev && pcEl){ flyToPile(pcEl, getComputedStyle(pcEl).transform); pcEl = null; }
  candidate = null;
  if (fanEl){ fanEl.remove(); fanEls.delete(id); }

function buildPC(id){

function flyToPile(el, fromT){

  const end = (e, cancel) => {
    if (!d || e.pointerId !== d.pid) return;
    const dx = e.clientX - d.x, dy = e.clientY - d.y, dist = Math.hypot(dx, dy), v = Math.hypot(d.vx, d.vy);
    const vx = d.vx, vy = d.vy; d = null;
    if (!cancel && (dist > 95 || (v > .55 && dist > 28))){ tossCard(el, dx, dy, vx, vy); }
    else { el.style.transition = 'transform .38s cubic-bezier(.3,1.5,.5,1)'; el.style.transform = ''; }
  };
  el.addEventListener('pointerup', e => end(e, false));
  el.addEventListener('pointercancel', e => end(e, true));
}
function tossCard(el, dx, dy, vx, vy){
  const id = el.dataset.id;
  flyToPile(el, `translate(${dx}px,${dy}px) rotate(${dx * .06}deg)`);
  if (pcEl === el) pcEl = null;
  commit(() => { if (S.hands[cur] === id){ S.hands[cur] = null; S.discard.push(id); } });
  ph.hidden = false; ph.animate([{opacity: 0}, {opacity: 1}], {duration: 300, delay: 180, fill: 'backwards'});
  layoutFan(); updateCounts(true); Haptic.toss();
}

/* tools */
tUndo.addEventListener('click', () => {
  if (busy || !canUndo()) return;
  const before = S.discard.slice();
  const t = undoS.pop(); redoS.push({view: cur, s: clone(S)}); S = t.s; save(); afterRestore(before);
});
tRedo.addEventListener('click', () => {
  if (busy || !canRedo()) return;
  const before = S.discard.slice();
  const t = redoS.pop(); undoS.push({view: cur, s: clone(S)}); S = t.s; save(); afterRestore(before);
});
function afterRestore(before){
  candidate = null; layoutFan();
  const id = S.hands[cur];
  const fromPile = id && before && before.includes(id) && !(pcEl && pcEl.dataset.id === id);
  const leaving = pcEl && pcEl.dataset.id !== id && S.discard.includes(pcEl.dataset.id) ? pcEl : null;
  if (leaving){ flyToPile(leaving, getComputedStyle(leaving).transform); pcEl = null; }
  renderPlay(!fromPile);
  if (fromPile && pcEl){ const o = pileOffset(); pcEl.animate([{transform: `translate(${o.dx}px,${o.dy}px) rotate(-10deg) scale(${o.s})`}, {transform: 'none'}], {duration: 420, easing: 'cubic-bezier(.2,.9,.25,1)'}); }
  updateCounts();
}
tShuffle.addEventListener('click', () => {
  if (busy) return;
  const ids = fanIds(); if (ids.length < 2) return;
  lock(720); candidate = null; Haptic.riffle();
  commit(() => {
    const pos = []; S.draw.forEach((id, i) => { if (inView(id, cur)) pos.push(i); });
    const sh = shuffle(pos.map(i => S.draw[i])); pos.forEach((p, j) => { S.draw[p] = sh[j]; });
  });
  for (const el of fanEls.values()){ el.classList.remove('cand'); el.style.transitionDelay = Math.round(Math.random() * 90) + 'ms'; el.style.setProperty('--a', ((Math.random() - .5) * 6).toFixed(1) + 'deg'); el.style.setProperty('--y', '-18px'); }
  updateHint();
  setTimeout(() => { layoutFan('riffle'); updateCounts(); }, 300);
});
function recycle(){
  const back = S.discard.filter(id => inView(id, cur));
  if (!back.length) return;
  commit(() => { S.discard = S.discard.filter(id => !inView(id, cur)); S.draw = S.draw.concat(shuffle(back)); });
  Haptic.riffle(); lock(700); enterFan(); updateCounts();
}
$('#emptyRecycle').addEventListener('click', recycle);
$('#emptyHome').addEventListener('click', () => goBackHome());

/* navigation */
function goDeck(v){
  cur = String(v); candidate = null; togglePmenu(false); closePreview(true);
  const c = cur === 'all' ? null : catOf(cur);
  $('#deckTitle').innerHTML = c ? `<svg viewBox="0 0 48 48" aria-hidden="true">${c.cover}</svg>${c.name}` : '몽땅 다 섞어 뽑기!!';
  home.classList.add('off'); deck.classList.remove('off');
  if (pcEl){ pcEl.remove(); pcEl = null; }
  requestAnimationFrame(() => {
    computeGeo(); sizePlay(); renderPlay(false); updateCounts(); enterFan();
    if (fanIds().length) Haptic.riffle();
  });
  pushH({deck: cur});
}
function goHome(){
  closeGrid(true); togglePmenu(false);
  cur = null; candidate = null; press = null;
  for (const el of fanEls.values()) el.remove(); fanEls.clear();
  if (pcEl){ pcEl.remove(); pcEl = null; }
  deck.classList.add('off'); home.classList.remove('off');
  renderHome(); renderPile();
}
function goBackHome(){ goHome(); popH('deck'); }
$('#homeBtn').addEventListener('click', goBackHome);
window.addEventListener('popstate', () => {
  if (skipPop > 0){ skipPop--; return; }
  if (!$('#order').hidden){ closeOrder(); return; }
  if (!$('#gridWrap').hidden){ closeGrid(); if (cur) pushH({deck: cur}); return; }
  if (cur) goHome();
});
let rz = 0;
window.addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => { if (cur){ computeGeo(); sizePlay(); layoutFan(); } }); });

/* ---------- GRID (보고 뽑기) ---------- */
const gridWrap = $('#gridWrap'), gridBody = $('#gridBody');
let gsel = null, gb = null;
tGrid.addEventListener('click', openGrid);
function openGrid(){
  if (busy) return;
  gsel = null;
  const cats = cur === 'all' ? CATS : [catOf(cur)];
  gridBody.innerHTML = cats.map(c => `<section class="gsec">${cur === 'all' ? `<h3>${c.id}. ${c.name}</h3>` : ''}<div class="ggrid">${c.qs.map((q, i) => {
    const id = c.id + '-' + pad(i + 1), used = !S.draw.includes(id);
    return `<button class="gtile${used ? ' used' : ''}" data-id="${id}" aria-label="${pad(i + 1)}번 질문${used ? ', 이미 나옴' : ''}"><svg viewBox="0 0 48 48" aria-hidden="true">${q.icon}</svg><span>${pad(i + 1)}</span></button>`;
  }).join('')}</div></section>`).join('') + '<div class="gbub" id="gbub" hidden></div>';
  gb = $('#gbub');
  gridBody.scrollTop = 0;
  gridWrap.hidden = false;
  requestAnimationFrame(() => requestAnimationFrame(() => gridWrap.classList.add('open')));
}
function closeGrid(instant){
  if (gridWrap.hidden) return;
  gridWrap.classList.remove('open'); gsel = null;
  if (instant){ gridWrap.hidden = true; return; }
  setTimeout(() => { if (!gridWrap.classList.contains('open')) gridWrap.hidden = true; }, 320);
}
$('#gridClose').addEventListener('click', () => closeGrid());
document.querySelector('.sheet-head').addEventListener('click', e => { if (!e.target.closest('#gridClose')) clearSel(); });
$('#gridDim').addEventListener('click', () => closeGrid());
gridBody.addEventListener('click', e => {
  if (e.target.closest('.gb-x')){ clearSel(); return; }
  if (e.target.closest('.gbub')){ pickFromGrid(gsel); return; }
  const t = e.target.closest('.gtile');
  if (!t){ clearSel(); return; }
  const id = t.dataset.id;
  if (gsel === id) pickFromGrid(id); else selTile(t, id);
});
function clearSel(){ gsel = null; gridBody.querySelectorAll('.gtile.sel').forEach(x => x.classList.remove('sel')); if (gb) gb.hidden = true; }
function selTile(t, id){
  gridBody.querySelectorAll('.gtile.sel').forEach(x => x.classList.remove('sel'));
  t.classList.add('sel'); gsel = id;
  const k = BY[id], used = !S.draw.includes(id), inHand = S.hands[cur] === id;
  gb.innerHTML = `<button class="gb-x" aria-label="닫기"><svg class="ic" viewBox="0 0 48 48"><path d="M13 13.5c7 6.5 14.3 13.7 21.6 21"/><path d="M34.5 13c-7 7.3-14.3 14.5-21.4 21.6"/></svg></button><div class="gb-top">${stars(k)}<span>${LV[k.lv]}</span></div><p>${esc(k.q)}</p><div class="gb-hint">${inHand ? '지금 펼쳐진 카드예요' : (used ? '이미 나온 질문이에요 · ' : '') + '한 번 더 눌러 뽑아 보세요'}</div>`;
  gb.hidden = false;
  const br = gridBody.getBoundingClientRect(), tr = t.getBoundingClientRect();
  const top = tr.top - br.top + gridBody.scrollTop;
  const cx = tr.left - br.left + tr.width / 2;
  const h = gb.offsetHeight, w = gb.offsetWidth;
  let y = top - h - 14, below = false;
  if (y < gridBody.scrollTop + 4){ y = top + tr.height + 14; below = true; }
  let x = Math.max(8, Math.min(gridBody.clientWidth - w - 8, cx - w / 2));
  gb.style.top = y + 'px'; gb.style.left = x + 'px';
  gb.style.setProperty('--tail', Math.max(22, Math.min(w - 22, cx - x)) + 'px');
  gb.classList.toggle('below', below);
  gb.animate([{transform: 'scale(.86)', opacity: 0}, {transform: 'scale(1)', opacity: 1}], {duration: 220, easing: 'cubic-bezier(.3,1.5,.5,1)'});
  if (below){ const over = (y + h) - (gridBody.scrollTop + gridBody.clientHeight) + 12; if (over > 0) gridBody.scrollBy({top: over, behavior: 'smooth'}); }
  Haptic.tap();
}
function pickFromGrid(id){
  if (!id) return;
  closeGrid();
  if (S.hands[cur] === id) return;
  setTimeout(() => drawCard(id, true), 120);
}

/* ---------- ORDER (순서 정하기) ---------- */
const order = $('#order'), oSetup = $('#oSetup'), oTouch = $('#oTouch'), fingersBox = $('#fingers');
const oMsg = $('#oMsg'), oCnt = $('#oCnt'), oActions = $('#oActions');
const COLORS = ['#FFD166', '#FF9FB2', '#7FDDF2', '#A6EBB8', '#FFB677', '#D3BEFF', '#FFFFFF', '#F6E58D', '#A9C8FF', '#FFC9E3'];
const fingers = new Map();
let oState = 'setup', cdStart = 0, cdRAF = 0, lastSec = 3, revealT = [];
const RING = 2 * Math.PI * 48;
$('#orderBtn1').addEventListener('click', openOrder);
$('#orderBtn2').addEventListener('click', openOrder);
function openOrder(){
  closeGrid(true);
  oState = 'setup'; oSetup.hidden = false; oTouch.hidden = true; order.hidden = false; renderPpl();
  pushH({deck: cur, order: 1});
}
function closeOrder(){ clearFingers(); oState = 'setup'; order.hidden = true; }
function closeOrderBtn(){ closeOrder(); popH('order'); }
$('#oClose1').addEventListener('click', closeOrderBtn);
$('#oClose2').addEventListener('click', closeOrderBtn);
$('#oDone').addEventListener('click', closeOrderBtn);
function renderPpl(){ $('#ppl').textContent = S.ppl; $('#pMinus').disabled = S.ppl <= 2; $('#pPlus').disabled = S.ppl >= 10; $('#oWarn').hidden = S.ppl <= 5; }
$('#pMinus').addEventListener('click', () => { S.ppl = Math.max(2, S.ppl - 1); save(); renderPpl(); });
$('#pPlus').addEventListener('click', () => { S.ppl = Math.min(10, S.ppl + 1); save(); renderPpl(); });
$('#oStart').addEventListener('click', startTouch);
$('#oAgain').addEventListener('click', startTouch);
function startTouch(){ clearFingers(); oState = 'wait'; oSetup.hidden = true; oTouch.hidden = false; oActions.hidden = true; updateOrderMsg(); }
function clearFingers(){ cancelAnimationFrame(cdRAF); revealT.forEach(clearTimeout); revealT = []; fingers.forEach(f => f.el.remove()); fingers.clear(); }
function updateOrderMsg(){
  const n = S.ppl, k = fingers.size;
  if (oState === 'result') return;
  if (oState === 'count'){ oMsg.textContent = '그대로 기다려요…'; oCnt.textContent = `${k} / ${n}`; return; }
  if (k > n){ oMsg.textContent = `${n}명보다 많아요! 손가락 ${k - n}개를 떼 주세요`; }
  else { oMsg.textContent = k === 0 ? `${n}명 모두 화면에 손가락을 하나씩 올려주세요` : '손가락을 떼지 말고 기다려주세요'; }
  oCnt.textContent = `${k} / ${n}`;
}
function makeFinger(f){
  const el = document.createElement('div'); el.className = 'finger';
  el.style.setProperty('--fc', f.color);
  el.innerHTML = `<div class="fin"><svg viewBox="0 0 112 112"><circle class="blob" cx="56" cy="56" r="40"/><circle class="ring" cx="56" cy="56" r="48"/><circle class="prog" cx="56" cy="56" r="48" stroke-dasharray="${RING}" stroke-dashoffset="${RING}"/></svg><div class="fnum"></div></div>`;
  fingersBox.appendChild(el); placeFinger(el, f.x, f.y); return el;
}
function placeFinger(el, x, y){ el.style.transform = `translate(${x}px,${y}px)`; }
function freeColor(){ const used = new Set([...fingers.values()].map(f => f.color)); return COLORS.find(c => !used.has(c)) || COLORS[fingers.size % COLORS.length]; }
oTouch.addEventListener('touchstart', e => { if (!e.target.closest('button')) e.preventDefault(); }, {passive: false});
oTouch.addEventListener('touchmove', e => { e.preventDefault(); }, {passive: false});
oTouch.addEventListener('pointerdown', e => {
  if (e.target.closest('button') || oState === 'result' || oState === 'setup') return;
  e.preventDefault();
  const f = {id: e.pointerId, x: e.clientX, y: e.clientY, color: freeColor()};
  f.el = makeFinger(f); fingers.set(e.pointerId, f);
  try { oTouch.setPointerCapture(e.pointerId); } catch (err) {}
  Haptic.tick(); fingersChanged();
});
oTouch.addEventListener('pointermove', e => { const f = fingers.get(e.pointerId); if (!f) return; f.x = e.clientX; f.y = e.clientY; placeFinger(f.el, f.x, f.y); });
function liftFinger(e){
  if (oState === 'result' || oState === 'setup') return;
  const f = fingers.get(e.pointerId); if (!f) return;
  f.el.remove(); fingers.delete(e.pointerId); fingersChanged();
}
oTouch.addEventListener('pointerup', liftFinger);
oTouch.addEventListener('pointercancel', liftFinger);
function fingersChanged(){
  if (fingers.size === S.ppl) startCountdown(); else stopCountdown();
  updateOrderMsg();
}
function setProg(p){ fingers.forEach(f => { const c = f.el.querySelector('.prog'); if (c) c.style.strokeDashoffset = String(RING * (1 - p)); }); }
function startCountdown(){
  if (oState === 'count') return;
  oState = 'count'; cdStart = performance.now(); lastSec = 3; Haptic.beat();
  const loop = t => {
    const p = Math.min(1, (t - cdStart) / 2000); setProg(p);
    const sec = 3 - Math.floor(p * 3);
    if (sec < lastSec && sec > 0){ lastSec = sec; Haptic.beat(); }
    if (p >= 1){ assignOrder(); return; }
    cdRAF = requestAnimationFrame(loop);
  };
  cdRAF = requestAnimationFrame(loop);
}
function stopCountdown(){ if (oState !== 'count') return; cancelAnimationFrame(cdRAF); oState = 'wait'; setProg(0); }
function assignOrder(){
  oState = 'result';
  const fs = [...fingers.values()];
  const ranks = shuffle(fs.map((_, i) => i + 1));
  fs.forEach((f, i) => { f.rank = ranks[i]; f.el.querySelector('.prog').style.strokeDashoffset = '0'; });
  /* show every number the moment the 3 seconds are up */
  fs.forEach(f => {
    f.el.querySelector('.fnum').textContent = f.rank;
    f.el.classList.add('ranked', f.rank === 1 ? 'first' : 'dim');
  });
  Haptic.win();
  oMsg.textContent = '1번부터 시작해요!'; oCnt.textContent = '번호 순서대로 나눠요'; oActions.hidden = false;
}

/* ---------- start ---------- */
try { if (!inFrame && history.state && (history.state.deck || history.state.order)) history.replaceState(null, ''); } catch (e) {}
renderHome();
})();
</script>

</body>
