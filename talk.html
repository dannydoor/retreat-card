  --heart:#E0507A;
  --font:'Gaegu','GaeguLocal','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  --wob:255px 18px 225px 18px/18px 225px 18px 255px;
  --wob2:18px 225px 18px 255px/255px 18px 225px 18px;
  --gut-l:max(16px,env(safe-area-inset-left,0px));
  --gut-r:max(16px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
*{box-sizing:border-box}
html{height:100%;background:var(--paper)}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.35;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button:disabled{opacity:.35;cursor:default}
p,h1,h2,h3{margin:0}
svg.ic,.ic svg{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#app{position:relative;height:100%;max-width:560px;margin:0 auto}
.view{position:absolute;inset:0;display:flex;flex-direction:column}
.ibtn{flex:0 0 auto;width:46px;height:46px;display:grid;place-items:center;color:var(--blue);background:var(--card);border:2px solid var(--blue);border-radius:var(--wob);box-shadow:2px 3px 0 var(--soft)}
.ibtn svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ibtn:active{transform:translate(1px,2px);box-shadow:none}
a.ibtn{text-decoration:none}
.ibtn.corner{position:absolute;top:8px;left:var(--gut-l);z-index:2}
.pvrow{position:relative;display:flex;justify-content:center;width:100%}
#pDice{position:absolute;right:calc(50% - 104px);bottom:0;width:42px;height:42px}
.pill{font-size:19px;padding:9px 20px;border:2px solid var(--blue);border-radius:var(--wob);color:var(--blue);background:var(--card)}
.pill.solid{background:var(--blue);color:var(--on-blue)}
.demo-note{font-size:15px;color:var(--muted);text-align:center;padding:4px 12px;background:var(--soft);border-radius:12px}

/* avatar */
.ava{width:var(--s);height:var(--s);flex:0 0 auto;border-radius:50%;background:var(--bg,#FFD166);display:grid;place-items:center;box-shadow:inset 0 0 0 2px rgba(28,40,92,.85)}
.ava svg{width:64%;height:64%;fill:none;stroke:var(--ink);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.ava.anon{background:var(--soft)}
.ava.anon svg{stroke:var(--muted)}

/* ===== room ===== */
#vRoom{align-items:center;justify-content:center;gap:16px;padding:24px var(--gut-r) 24px var(--gut-l);text-align:center}
#vRoom img{width:110px;height:auto}
#vRoom h1{font-size:40px;color:var(--blue);line-height:1.1}
#roomForm{display:flex;flex-direction:column;align-items:stretch;gap:12px;width:min(300px,100%)}
.field{width:100%;font:inherit;font-size:22px;text-align:center;padding:12px 14px;border:2px solid var(--blue);border-radius:var(--wob);background:var(--card);color:var(--ink)}
.err{min-height:1.4em;font-size:17px;color:var(--heart)}
.bigbtn{width:100%;padding:13px;font-size:24px;font-weight:700;background:var(--blue);color:var(--on-blue);border-radius:var(--wob2);box-shadow:3px 4px 0 var(--soft)}
.bigbtn:active{transform:translate(1px,2px);box-shadow:none}

/* ===== profile ===== */
#vProfile{overflow-y:auto;align-items:center;gap:10px;padding:16px var(--gut-r) 24px var(--gut-l)}
#vProfile h2{font-size:32px;color:var(--blue)}
#profileForm{display:flex;flex-direction:column;align-items:center;gap:11px;width:min(340px,100%)}
#pPreview{padding:4px}
.plabel{align-self:flex-start;font-size:17px;color:var(--muted)}
#avGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:100%}
.avopt{display:grid;place-items:center;padding:4px;border-radius:50%}
.avopt.on{box-shadow:0 0 0 3px var(--blue)}
#colRow{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.colopt{width:32px;height:32px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 2px rgba(28,40,92,.5)}
.colopt.on{box-shadow:inset 0 0 0 2px rgba(28,40,92,.5),0 0 0 3px var(--paper),0 0 0 5px var(--blue)}
.prow{display:flex;gap:10px;width:100%}
.prow .bigbtn{flex:1}
.linkbtn{font-size:16px;color:var(--muted);text-decoration:underline;text-underline-offset:4px;padding:6px 10px}

/* ===== chat ===== */
.top{display:grid;grid-template-columns:46px 1fr 46px;align-items:center;gap:8px;padding:8px var(--gut-r) 4px var(--gut-l)}
.top h1{font-size:25px;color:var(--blue);text-align:center;line-height:1.1}
#meBtn{width:46px;height:46px;display:grid;place-items:center;border-radius:50%}
.top .demo-note{grid-column:1/-1;justify-self:center;margin-top:4px}
#filter{display:flex;gap:6px;overflow-x:auto;padding:6px var(--gut-r) 8px var(--gut-l);scrollbar-width:none}
#filter::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:4px;padding:4px 12px;font-size:16px;color:var(--blue);background:var(--card);border:2px solid var(--blue);border-radius:var(--wob);white-space:nowrap}
.chip:nth-child(even){border-radius:var(--wob2)}
.chip svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chip.on{background:var(--blue);color:var(--on-blue)}
#listWrap{position:relative;flex:1 1 auto;min-height:0}
#list{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:8px var(--gut-r) 18px var(--gut-l);display:flex;flex-direction:column;gap:16px}
.day{text-align:center;margin:4px 0}
.day span{font-size:14px;color:var(--muted);background:var(--soft);padding:3px 12px;border-radius:12px}
.msg{display:flex;gap:8px;align-items:flex-start}
.msg.mine{justify-content:flex-end}
.msg.new{animation:popin .38s cubic-bezier(.3,1.5,.5,1)}
@keyframes popin{from{transform:translateY(10px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.mb{display:flex;flex-direction:column;gap:4px;max-width:min(82%,420px);min-width:0}
.msg.mine .mb{align-items:flex-end}
.meta{display:flex;gap:7px;align-items:baseline;font-size:14px;color:var(--muted);padding:0 4px}
.meta b{font-size:17px;color:var(--ink)}
.tag{font-size:13px;padding:0 7px;border-radius:9px;background:var(--soft)}
.bub{position:relative;min-width:0;background:var(--card);border:2px solid var(--line);border-radius:6px 22px 20px 22px/6px 18px 22px 18px;padding:10px 13px 11px;box-shadow:0 2px 6px var(--shadow)}
.msg.mine .bub{background:var(--blue);border-color:var(--blue);color:var(--on-blue);border-radius:22px 6px 22px 20px/18px 6px 18px 22px}
.qref{display:flex;align-items:flex-start;gap:7px;width:100%;text-align:left;padding-bottom:8px;margin-bottom:8px;border-bottom:1.5px dashed var(--line);color:var(--blue);font-size:14.5px;line-height:1.3}
.msg.mine .qref{color:rgba(255,255,255,.9);border-color:rgba(255,255,255,.35)}
.qi{width:24px;height:24px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.qref span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.txt{font-size:19px;line-height:1.42;white-space:pre-wrap;-webkit-user-select:text;user-select:text}
.edited{display:block;margin-top:4px;font-size:12.5px;opacity:.7;text-align:right}
.acts{display:flex;gap:2px;padding:0 2px}
.act{display:flex;align-items:center;gap:3px;min-width:40px;height:32px;padding:0 8px;font-size:15px;color:var(--muted);border-radius:16px;font-variant-numeric:tabular-nums}
.act svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.act.heart.on{color:var(--heart)}
.act.heart.on svg{fill:currentColor}
.act:active{background:var(--soft)}
.empty{margin:auto;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:var(--muted);font-size:19px;padding:40px 0}
.empty svg{width:64px;height:64px;fill:none;stroke:var(--line);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#newPill{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);padding:6px 16px;font-size:16px;background:var(--blue);color:var(--on-blue);border-radius:16px;box-shadow:0 4px 12px var(--shadow);z-index:3}

/* composer */
#composer{flex:0 0 auto;display:flex;flex-direction:column;gap:8px;padding:9px var(--gut-r) 10px var(--gut-l);background:var(--card);border-top:2px solid var(--line);border-radius:22px 26px 0 0/14px 16px 0 0;box-shadow:0 -4px 14px rgba(18,28,80,.06)}
#editBar{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:16px;color:var(--blue)}
#editBar button{font-size:16px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:2px 6px}
.crow1{display:flex;gap:8px;align-items:stretch}
#qchip{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:8px;padding:6px 8px 6px 9px;text-align:left;color:var(--blue);background:var(--paper);border:2px solid var(--blue);border-radius:var(--wob)}
#qchip .qi{width:30px;height:30px}
#qchip .qi-empty{display:grid;place-items:center}
#qchip .qi-empty svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.2}
.qtext{flex:1 1 auto;min-width:0;font-size:14.5px;line-height:1.25;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qtext.ph{color:var(--muted)}
.qtext.ph b{color:var(--blue)}
#qchip>svg:last-child{width:20px;height:20px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#qchip.none{border-style:dashed}
#anon{flex:0 0 auto;padding:0 12px;font-size:16px;color:var(--muted);border:2px solid var(--line);border-radius:var(--wob2);background:var(--card)}
#anon[aria-pressed="true"]{background:var(--ink);color:var(--on-blue);border-color:var(--ink)}
.crow2{display:flex;gap:8px;align-items:flex-end}
#ta,#tta{flex:1 1 auto;min-width:0;resize:none;font:inherit;font-size:18px;line-height:1.35;padding:9px 13px;max-height:132px;color:var(--ink);background:var(--card);border:2px solid var(--blue);border-radius:20px 24px 22px 26px/24px 20px 26px 22px;-webkit-user-select:text;user-select:text}
.send{flex:0 0 auto;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:var(--on-blue);box-shadow:2px 3px 0 var(--soft)}
.send svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.send .ok{display:none}
.send.save .go{display:none}
.send.save .ok{display:block}

/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:40}
.sheet-dim{position:absolute;inset:0;background:rgba(16,24,64,.42);opacity:0;transition:opacity .25s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;height:min(86%,760px);background:var(--paper);border-radius:26px 30px 0 0/22px 26px 0 0;display:flex;flex-direction:column;transform:translateY(102%);transition:transform .32s cubic-bezier(.2,.85,.25,1);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -6px 24px var(--shadow)}
.sheet-wrap.open .sheet-dim{opacity:1}
.sheet-wrap.open .sheet{transform:none}
.sheet-head{display:grid;grid-template-columns:1fr 46px;align-items:center;gap:10px;padding:14px var(--gut-r) 8px var(--gut-l)}
.sheet-head b{font-size:25px;color:var(--blue);line-height:1.1}
#pickBody{position:relative;flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px var(--gut-r) 26px var(--gut-l);display:flex;flex-direction:column;gap:18px}
.pchat{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;text-align:left;color:var(--blue);background:var(--card);border:2px solid var(--blue);border-radius:var(--wob);box-shadow:2px 3px 0 var(--soft)}
.pchat svg{width:36px;height:36px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pchat span{display:flex;flex-direction:column;gap:1px}
.pchat b{font-size:20px}
.pchat small{font-size:15px;color:var(--muted)}
.pchat.cur{box-shadow:0 0 0 3px var(--blue)}
.psec h3{display:flex;align-items:center;gap:6px;font-size:20px;color:var(--blue);margin:0 2px 8px}
.psec h3 svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ptile{position:relative;aspect-ratio:1/.8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--card);color:var(--blue);border:2px solid var(--blue);border-radius:var(--wob);box-shadow:2px 3px 0 var(--soft)}
.ptile:nth-child(3n+2){border-radius:var(--wob2)}
.pti{width:42%;height:auto;aspect-ratio:1;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.ptile span{font-size:14px;color:var(--muted)}
.ptile.cur{box-shadow:0 0 0 3px var(--blue)}
.ptile.sel{background:var(--blue);color:var(--on-blue);transform:scale(1.05);z-index:2}
.ptile.sel span{color:var(--on-blue)}
.pcount{position:absolute;top:5px;right:6px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--soft);color:var(--blue);font-size:13px;font-style:normal;display:grid;place-items:center}
.pbub{position:absolute;z-index:5;width:min(290px,calc(100% - 24px));padding:12px 15px 11px;background:var(--card);border:2px solid var(--blue);border-radius:20px 26px 22px 28px/24px 20px 28px 22px;box-shadow:0 8px 22px var(--shadow);cursor:pointer}
.pbub::after{content:"";position:absolute;left:calc(var(--tail,50%) - 9px);bottom:-10px;width:16px;height:16px;background:var(--card);border-right:2px solid var(--blue);border-bottom:2px solid var(--blue);transform:rotate(45deg)}
.pbub.below::after{bottom:auto;top:-10px;transform:rotate(225deg)}
.pb-top span{font-size:14px;color:var(--muted)}
.pbub p{font-size:19px;font-weight:700;line-height:1.32;margin:3px 0 6px}
.pb-hint{font-size:15px;color:var(--blue)}

/* comments */
#tHead{margin:0 var(--gut-r) 0 var(--gut-l);padding:11px 13px;background:var(--card);border:2px solid var(--line);border-radius:18px 22px 20px 24px/22px 18px 24px 20px}
.th-who{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--muted)}
.th-who b{font-size:17px;color:var(--ink)}
.th-q{display:flex;gap:6px;align-items:flex-start;margin:7px 0 5px;font-size:14px;color:var(--blue);line-height:1.3}
.th-txt{font-size:17px;line-height:1.4;white-space:pre-wrap;max-height:7.2em;overflow:auto}
#tList{flex:1 1 auto;min-height:0;overflow-y:auto;padding:12px var(--gut-r) 12px var(--gut-l);display:flex;flex-direction:column;gap:12px}
.cm{display:flex;gap:8px;align-items:flex-start}
.cb{flex:1 1 auto;min-width:0}
.cmeta{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--muted)}
.cmeta b{font-size:16px;color:var(--ink)}
.cdel{margin-left:auto;width:32px;height:28px;display:grid;place-items:center;color:var(--muted)}
.cdel svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cb p{font-size:17px;line-height:1.38;white-space:pre-wrap;-webkit-user-select:text;user-select:text}
.cask{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:16px!important;color:var(--blue)}
.cask button{font-size:16px;padding:2px 10px;border:2px solid var(--blue);border-radius:var(--wob)}
.cask .cyes{background:var(--blue);color:var(--on-blue)}
.cempty{margin:auto;color:var(--muted);font-size:17px}
#tForm{display:flex;gap:8px;align-items:flex-end;padding:9px var(--gut-r) 10px var(--gut-l);background:var(--card);border-top:2px solid var(--line)}

/* my-post menu */
#more{position:fixed;z-index:50;min-width:160px;padding:6px;background:var(--card);border:2px solid var(--blue);border-radius:18px 22px 20px 24px/22px 18px 24px 20px;box-shadow:0 8px 22px var(--shadow);display:flex;flex-direction:column}
#more>button{display:flex;align-items:center;gap:8px;padding:9px 12px;font-size:18px;color:var(--ink);border-radius:12px;text-align:left}
#more>button:active{background:var(--soft)}
#more svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#more p{padding:8px 10px 4px;font-size:17px}
#more .row{display:flex;gap:8px;padding:6px}
#more .row button{flex:1;padding:6px 10px;font-size:17px;border:2px solid var(--blue);border-radius:var(--wob);color:var(--blue)}
#more .row .danger{background:var(--heart);border-color:var(--heart);color:var(--on-blue)}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);transform:translateX(-50%);z-index:70;padding:8px 18px;font-size:17px;background:var(--ink);color:var(--on-blue);border-radius:18px;box-shadow:0 6px 16px var(--shadow);white-space:nowrap;pointer-events:none}
#toast.go{animation:toast .25s ease}
@keyframes toast{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion:reduce){.msg.new,#toast.go{animation:none}.sheet{transition-duration:.01s}}
</style>
</head>
<body>


<div id="app">
